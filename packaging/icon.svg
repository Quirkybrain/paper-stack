<?xml version="1.0" encoding="UTF-8"?>
<!--
  PaperStack (纸栈) application icon — minimal stack-of-sheets mark.
  Authored for wp-43 (C2 packaging) in the product accent colour
  (#176b5b, the accent design token). Intentionally simple: no text,
  no gradients, reads at 32 px. Rasterised by packaging/generate-icons.sh
  with ffmpeg/librsvg into src-tauri/icons/.
-->
